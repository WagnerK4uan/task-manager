spring:
  application:
    name: task-manager

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # O schema vem das migrations; o Hibernate só confere se o mapeamento bate.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
